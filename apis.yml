name: Orbital Operations
description: 'Orbital Operations is a space-defense technology company founded in 2024 and based in Huntington
  Beach, California, developing high-thrust, cryogenic-powered orbital vehicles for rapid-response satellite
  defense, interception, and in-orbit repositioning. Its flagship Astraeus vehicle uses liquid-hydrogen
  propulsion with a proprietary zero-boil-off (ZBO) cryogenic storage system enabling in-space refueling
  and efficient payload transport between LEO, MEO, GEO, and lunar orbits. Backed by Initialized Capital,
  the company builds spaceflight hardware and does not currently expose a public developer API, SDK, or
  developer portal.'
